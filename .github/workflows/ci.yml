name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-und-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tests (ohne Abhängigkeiten)
        run: |
          (cd packages/shared && node --test "test/**/*.test.ts")
          (cd apps/api && node --test "test/**/*.test.ts")
      # Versions of typescript and @types/node come from package-lock.json.
      - name: Abhängigkeiten installieren (genau nach package-lock.json)
        run: npm ci
      - name: Typprüfung
        run: |
          npx tsc --noEmit -p packages/shared
          npx tsc --noEmit -p apps/api

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci fails if package.json and package-lock.json disagree,
      # so the Expo versions cannot drift between runs.
      - name: Abhängigkeiten installieren (genau nach package-lock.json)
        run: npm ci
      - name: Expo-Versionen prüfen
        working-directory: apps/mobile
        run: npx expo install --check
      - name: Typprüfung
        working-directory: apps/mobile
        run: npx tsc --noEmit -p .
      - name: Web-Build
        working-directory: apps/mobile
        run: npx expo export --platform web
